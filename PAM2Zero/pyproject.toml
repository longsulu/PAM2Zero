[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pam2zero"
version = "0.1.0"
description = "Compact and decomposable CRISPR-Cas9 off-target prediction"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.21", "pandas>=1.3", "scipy>=1.7", "scikit-learn>=1.0",
  "torch>=1.12", "matplotlib>=3.5", "tqdm>=4.60", "openpyxl>=3.0",
  "threadpoolctl>=3.0"
]

[project.scripts]
pam2zero = "pam2zero.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pam2zero = ["resources/*.json"]

